# =============================================================================
# Configuration de l'analyse SonarQube — MicroCRM (Orion)
# =============================================================================
# Analyse du monorepo en une seule passe : le frontend Angular/TypeScript et le
# backend Java/Spring Boot sont deux composants d'un même produit, et la dette
# doit être pilotée sur un tableau de bord unique.
#
# Voir docs/05-plan-securite.md pour la stratégie, et docs/JOURNAL_IA.md pour
# la justification du choix « serveur en conteneur » plutôt que SonarCloud.
# =============================================================================

sonar.projectKey=orion-microcrm
sonar.projectName=MicroCRM (Orion)
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# --- Périmètre analysé -------------------------------------------------------
# `app/back/src/main` et non `app/back/src` : le code de test est déclaré
# séparément ci-dessous, faute de quoi SonarQube l'analyserait comme du code de
# production et fausserait à la fois les métriques et la quality gate.
sonar.sources=app/front/src,app/back/src/main
sonar.tests=app/back/src/test

# --- Exclusions --------------------------------------------------------------
# Les fichiers *.spec.ts du frontend cohabitent avec les sources dans
# `app/front/src`. SonarQube refuse qu'un même fichier soit indexé à la fois
# comme source et comme test ; ils sont donc exclus de l'analyse de production.
# Contrepartie assumée et documentée : la qualité du code de test frontend
# n'est pas mesurée — le rapport de couverture, lui, l'est bien.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts

# --- Compilation Java --------------------------------------------------------
# Obligatoire : sans les classes compilées, l'analyseur Java se limite à une
# lecture syntaxique et ne détecte NI les vulnérabilités NI les security
# hotspots — c'est-à-dire précisément ce que le projet cherche à obtenir.
sonar.java.source=17
sonar.java.binaries=app/back/build/classes/java/main
sonar.java.test.binaries=app/back/build/classes/java/test

# --- Rapports de couverture --------------------------------------------------
# Produits par scripts/run-tests.sh (constats C6 et C7 de l'audit).
sonar.coverage.jacoco.xmlReportPaths=reports/back/jacoco.xml
sonar.javascript.lcov.reportPaths=reports/front/lcov.info
sonar.typescript.lcov.reportPaths=reports/front/lcov.info
