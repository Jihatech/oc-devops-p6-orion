# =============================================================================
# Pipeline d'intégration continue — MicroCRM (Orion)
# =============================================================================
#
# BUT
#   Mettre en œuvre la chaîne CI/CD définie dans docs/03-normalisation-plan-ci.md.
#   Les cinq étapes sont en place :
#     ① lint  ② build  ③ test  ④ security  ⑤ package
#   Elles ont été ajoutées de façon incrémentale (§11 du plan), chaque
#   incrément laissant le pipeline vert.
#
# PRINCIPES APPLIQUÉS (docs/03, §1)
#   P1 fail fast     — le lint (secondes) précède le build et les tests (minutes)
#   P4 traçabilité   — chaque exécution produit des artefacts et un résumé daté
#   P5 reproductible — runner, actions, Node et JDK épinglés à une version exacte
#
# PARITÉ POSTE ↔ CI
#   Les jobs n'exécutent PAS de commandes ad hoc : ils appellent les mêmes
#   scripts que ceux utilisés en local (`scripts/*.sh`). Un développeur
#   reproduit donc exactement le comportement du pipeline sur sa machine, et
#   une correction apportée au script bénéficie aux deux environnements.
#   C'est la réponse directe au constat C5 de l'audit (logique dupliquée entre
#   les jobs, dérive entre poste et CI).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Sécurité : permissions minimales par défaut (docs/03, §8).
# Aucun job n'obtient plus de droits que ce qu'il consomme réellement. Trois
# jobs seulement sont élevés, et chacun sur le strict périmètre qu'il utilise :
#   notification -> issues:write    (ouvrir une issue de suivi sur échec)
#   package      -> packages:write  (publier les images sur GHCR)
#   release      -> contents:write  (poser le tag et le changelog)
permissions:
  contents: read

# Une nouvelle exécution sur la même référence annule la précédente : inutile
# de payer un pipeline complet pour un commit déjà remplacé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versions épinglées (P5). Node 20 est la ligne LTS supportée par Angular 17
  # (^18.13 || ^20.9) : le pipeline d'origine utilisait l'image `node` sans
  # étiquette, ce qui rendait le build non reproductible (constat C4).
  NODE_VERSION: "20.19.0"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  BASH_UNIT_VERSION: "v2.3.3"
  SHELLCHECK_VERSION: "0.11.0"
  TRIVY_VERSION: "0.74.0"
  SONAR_IMAGE: "sonarqube:25.12.0.117093-community"
  SONAR_SCANNER_IMAGE: "sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1"

jobs:
  # ===========================================================================
  # ÉTAPE ① — LINT (cible : moins d'une minute)
  # ===========================================================================

  lint-front:
    name: "① Lint · frontend (ESLint)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/front/package-lock.json

      - name: Installer les dépendances
        run: ./scripts/install-deps.sh --composant front

      - name: Analyser le code (ESLint)
        working-directory: app/front
        run: npm run lint

  lint-scripts:
    name: "① Lint · scripts (ShellCheck)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      # ShellCheck est préinstallé sur l'image ubuntu-24.04, mais dans une
      # version qui suit les mises à jour de l'image (0.9.0 à ce jour). S'y
      # fier ferait dépendre le verdict du lint d'un composant hors de notre
      # contrôle — exactement le défaut de reproductibilité reproché au
      # pipeline d'origine (constat C4, principe P5). La version est donc
      # épinglée, et elle est identique à celle utilisée sur les postes.
      - name: Installer ShellCheck (version épinglée)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Vérifier les scripts Bash
        run: |
          shellcheck --shell=bash --severity=style --external-sources \
            scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh

      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile scripts/notify.py

      # Garde-fou ajouté après incident : le projet est développé sous Windows,
      # qui ne porte pas le bit exécutable. `app/back/gradlew` avait ainsi été
      # versionné en 644, faisant échouer le build backend en « exit 126 :
      # permission denied » — un défaut invisible sur le poste de
      # développement. Le pipeline le détecte désormais dès l'étape de lint,
      # avec le message de correction exact.
      - name: Vérifier que les fichiers exécutables le sont réellement
        run: |
          manquants=0
          for f in scripts/*.sh scripts/tests/*.sh app/back/gradlew; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::le bit exécutable est absent (git update-index --chmod=+x $f)"
              manquants=$((manquants + 1))
            fi
          done
          exit $manquants

  lint-manifestes:
    name: "① Lint · charts Helm"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer Helm (version épinglée)
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.19.0

      - name: Vérifier la syntaxe du chart
        run: helm lint helm/microcrm --set image.tag=verification

      # Le rendu est vérifié POUR CHAQUE environnement : une valeur absente ou
      # mal typée dans values-staging.yaml ne se révélerait sinon qu'au moment
      # du déploiement en recette, c'est-à-dire trop tard.
      - name: Rendre les manifestes de chaque environnement
        run: |
          set -euo pipefail
          for env in dev staging; do
            echo "::group::Rendu de l'environnement $env"
            helm template microcrm helm/microcrm \
              --values "helm/microcrm/values-${env}.yaml" \
              --set image.tag=sha-verification > "/tmp/manifestes-${env}.yaml"
            grep -c '^kind:' "/tmp/manifestes-${env}.yaml" | xargs echo "ressources rendues :"
            echo "::endgroup::"
          done

      # Vérifie que le garde-fou du chart fonctionne toujours : sans tag
      # d'image explicite, le rendu DOIT échouer. Un déploiement sur un tag
      # implicite rendrait impossible de savoir quelle version tourne
      # (faiblesse f4) et priverait le rollback de cible fiable.
      - name: Vérifier que le tag d'image reste obligatoire
        run: |
          if helm template microcrm helm/microcrm >/dev/null 2>&1; then
            echo "::error::Le chart accepte un rendu sans image.tag — le garde-fou a disparu."
            exit 1
          fi
          echo "Garde-fou confirmé : le rendu échoue sans image.tag explicite."

      - name: Valider les manifestes contre le schéma Kubernetes
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -strict -summary /tmp/manifestes-dev.yaml /tmp/manifestes-staging.yaml

  # ===========================================================================
  # ÉTAPE ② — BUILD
  # Barrière de stage : le build n'est engagé que si TOUT le lint est vert
  # (docs/03, §4.6).
  # ===========================================================================

  build-front:
    name: "② Build · frontend (Angular)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-front, lint-scripts, lint-manifestes]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/front/package-lock.json

      - name: Installer les dépendances
        run: ./scripts/install-deps.sh --composant front

      - name: Construire le bundle de production
        working-directory: app/front
        run: npx ng build --configuration production

      - name: Publier le bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bundle-front
          path: app/front/dist/
          retention-days: 7

  build-back:
    name: "② Build · backend (Spring Boot)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-front, lint-scripts, lint-manifestes]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer le JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      # `-x test` : la compilation et les tests sont deux questions distinctes
      # (docs/03, §4.2). Le pipeline d'origine les confondait, ce qui faisait
      # remonter une erreur de compilation comme un échec de test.
      - name: Compiler et assembler le JAR
        working-directory: app/back
        run: ./gradlew build -x test --console=plain

      - name: Publier le JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jar-back
          path: app/back/build/libs/*.jar
          retention-days: 7

  # ===========================================================================
  # ÉTAPE ③ — TEST
  # ===========================================================================

  test-front:
    name: "③ Test · frontend (Karma + couverture)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-front]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/front/package-lock.json

      - name: Installer les dépendances
        run: ./scripts/install-deps.sh --composant front

      # Chrome est préinstallé sur l'image ubuntu-24.04. Le script le détecte
      # lui-même : le pipeline d'origine codait en dur un chemin propre à
      # l'image `cypress/browsers`, inutilisable ailleurs.
      - name: Exécuter les tests avec couverture
        run: ./scripts/run-tests.sh --composant front --sortie reports

      - name: Publier les rapports frontend
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rapports-front
          path: reports/
          retention-days: 7

  test-back:
    name: "③ Test · backend (JUnit + JaCoCo)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-back]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer le JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Exécuter les tests avec couverture
        run: ./scripts/run-tests.sh --composant back --sortie reports

      - name: Publier les rapports backend
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rapports-back
          path: reports/
          retention-days: 7

  test-scripts:
    name: "③ Test · scripts (bash_unit)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint-scripts]
    steps:
      - uses: actions/checkout@v7.0.1

      # Version épinglée (P5) : `master` ferait dépendre le résultat des
      # tests d'un dépôt tiers susceptible de changer sans préavis.
      - name: Installer bash_unit
        run: |
          curl -sSL -o /tmp/bash_unit \
            "https://raw.githubusercontent.com/pgrange/bash_unit/${BASH_UNIT_VERSION}/bash_unit"
          chmod +x /tmp/bash_unit
          /tmp/bash_unit -v

      - name: Exécuter les tests unitaires des scripts
        run: /tmp/bash_unit scripts/tests/test_commun.sh

      # Vérifie que la sauvegarde fonctionne réellement de bout en bout :
      # création, empreinte, manifeste, puis restauration et comparaison.
      # Un back-up jamais restauré n'est pas un back-up (docs/03).
      - name: Vérifier le cycle sauvegarde → restauration
        run: |
          set -euo pipefail
          ./scripts/backup.sh --source docs --source scripts \
            --destination /tmp/backups --retention 3
          archive=$(find /tmp/backups -name 'microcrm_*.tar.gz' | head -1)
          echo "Archive produite : $archive"
          test -f "$archive.sha256" || { echo "empreinte SHA-256 absente"; exit 1; }
          test -f "$archive.json"   || { echo "manifeste absent"; exit 1; }
          ./scripts/backup.sh --mode restauration --archive "$archive" --cible /tmp/restaure
          diff -r docs /tmp/restaure/docs
          echo "Cycle sauvegarde → restauration vérifié : contenu identique."

  # ===========================================================================
  # ÉTAPE ④ — SECURITY
  # Placée après ③ pour deux raisons (docs/03, §4.3) : il est inutile
  # d'engager 4 minutes d'analyse sur du code dont les tests échouent, et
  # SonarQube CONSOMME les rapports de couverture, qui n'existent qu'après
  # l'exécution des tests.
  # ===========================================================================

  sonarqube:
    name: "④ Security · SonarQube (SAST + hotspots)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test-front, test-back]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Analyse complète : SonarQube exploite l'historique Git pour dater
          # les issues et distinguer le code nouveau du code existant.
          fetch-depth: 0

      - name: Installer le JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      # Sans les classes compilées, l'analyseur Java se limite à une lecture
      # syntaxique et ne détecte NI vulnérabilités NI security hotspots.
      - name: Compiler les classes Java
        working-directory: app/back
        run: ./gradlew classes testClasses --console=plain

      - name: Récupérer les rapports de couverture
        uses: actions/download-artifact@v7.0.0
        with:
          path: reports
          pattern: rapports-*
          merge-multiple: true

      - name: Vérifier la présence des rapports de couverture
        run: |
          ls -R reports || true
          test -f reports/back/jacoco.xml  || echo "::warning::rapport JaCoCo absent"
          test -f reports/front/lcov.info  || echo "::warning::rapport LCOV absent"

      # vm.max_map_count est requis par l'Elasticsearch embarqué dans
      # SonarQube. C'est aussi la raison pour laquelle le serveur est démarré
      # dans une étape et non via `services:` : ces dernières démarrent avant
      # toute étape, donc avant que ce paramètre puisse être ajusté.
      - name: Préparer le noyau pour Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Analyser le code et exploiter la quality gate
        run: ./scripts/sonar-analyse.sh --demarrer --arreter --delai 300

      - name: Publier les preuves d'analyse
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: preuves-sonarqube
          path: docs/captures/sonarqube/
          retention-days: 30

  scan-securite:
    name: "④ Security · dépendances, secrets et configurations"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test-front, test-back]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/front/package-lock.json

      # Version épinglée plutôt qu'une action tierce : la chaîne de sécurité
      # ne doit pas elle-même reposer sur un composant non maîtrisé.
      - name: Installer Trivy (version épinglée)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # Les dépendances doivent être installées pour que `npm audit` dispose
      # de l'arbre résolu.
      - name: Installer les dépendances frontend
        run: ./scripts/install-deps.sh --composant front

      # Le JAR est nécessaire à l'analyse des dépendances Java : en l'absence
      # de gradle.lockfile, Trivy lit les bibliothèques embarquées dans le JAR.
      - name: Récupérer le JAR backend
        uses: actions/download-artifact@v7.0.0
        with:
          name: jar-back
          path: app/back/build/libs

      - name: Exécuter les contrôles de sécurité
        run: ./scripts/scan-securite.sh --sortie reports/securite

      - name: Publier les rapports de sécurité
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rapports-securite
          path: reports/securite/
          retention-days: 30

  # ===========================================================================
  # ÉTAPE ⑤ — PACKAGE
  #
  # Ordre interne CRITIQUE (docs/03, §4.4) : construire → SCANNER → publier.
  # Le scan Trivy se situe ENTRE le build et le push, à l'intérieur du même
  # job. Conséquence directe et voulue : une image vulnérable n'atteint JAMAIS
  # le registre. C'est la traduction technique littérale de la demande de
  # l'équipe Ops — « analyser les images en amont de leur transmission pour
  # éviter les retours à l'envoyeur » — et la réponse au goulot G1 de l'audit.
  #
  # Placer le scan dans un job ultérieur aurait été plus simple à écrire, mais
  # inopérant : l'image serait déjà publiée au moment du verdict.
  # ===========================================================================

  package:
    name: "⑤ Package · images Docker et publication GHCR"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [sonarqube, scan-securite]
    permissions:
      contents: read
      # Élévation limitée à ce job et à ce seul périmètre : c'est le seul qui
      # publie. Le GITHUB_TOKEN est régénéré à chaque exécution, ce qui évite
      # tout jeton de registre longue durée (lacune S5, menace M3).
      packages: write
    outputs:
      tag-sha: ${{ steps.metadonnees.outputs.tag-sha }}
      prefixe: ${{ steps.metadonnees.outputs.prefixe }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Calculer les métadonnées de publication
        id: metadonnees
        run: |
          set -euo pipefail
          # Le nom du dépôt GitHub peut contenir des majuscules ; les
          # références d'images doivent être entièrement en minuscules.
          prefixe="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tag_sha="sha-$(git rev-parse --short HEAD)"
          echo "prefixe=$prefixe"   >> "$GITHUB_OUTPUT"
          echo "tag-sha=$tag_sha"   >> "$GITHUB_OUTPUT"
          echo "Préfixe : $prefixe"
          echo "Tag immuable : $tag_sha"

      - name: Installer Trivy (version épinglée)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # --- 1. CONSTRUCTION (sans publication) ------------------------------
      # Les images sont chargées dans le démon local, pas poussées. Rien ne
      # part vers le registre tant que le scan n'a pas rendu son verdict.
      - name: Construire les images
        run: |
          set -euo pipefail
          for composant in back front; do
            echo "::group::Construction de $composant"
            docker build \
              --file "app/${composant}/Dockerfile" \
              --tag "orion-microcrm-${composant}:${{ steps.metadonnees.outputs.tag-sha }}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              app/
            echo "::endgroup::"
          done
          docker images --filter=reference='orion-microcrm-*' \
            --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      # --- 2. SCAN BLOQUANT -------------------------------------------------
      - name: Scanner les images (bloquant avant publication)
        run: |
          set -euo pipefail
          mkdir -p reports/images
          echec=0
          for composant in back front; do
            image="orion-microcrm-${composant}:${{ steps.metadonnees.outputs.tag-sha }}"
            echo "::group::Scan de $image"
            # Rapport complet conservé quel que soit le verdict : c'est la
            # preuve archivée de l'état de sécurité de l'image publiée.
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress --format json \
              --output "reports/images/trivy-${composant}.json" "$image"
            if ! trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                 --no-progress --exit-code 1 "$image"; then
              echo "::error::L'image $composant porte des vulnérabilités HIGH/CRITICAL corrigibles — publication BLOQUÉE."
              echec=1
            fi
            echo "::endgroup::"
          done
          exit $echec

      - name: Publier les rapports de scan d'image
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rapports-images
          path: reports/images/
          retention-days: 30

      # --- 3. PUBLICATION (seulement si le scan est passé) ------------------
      - name: S'authentifier auprès de GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publier les images
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          prefixe="${{ steps.metadonnees.outputs.prefixe }}"
          tag="${{ steps.metadonnees.outputs.tag-sha }}"
          for composant in back front; do
            cible="${prefixe}/orion-microcrm-${composant}:${tag}"
            docker tag "orion-microcrm-${composant}:${tag}" "$cible"
            docker push "$cible"
            echo "Publiée : $cible"
          done
          {
            echo "### ⑤ Images publiées sur GHCR"
            echo ""
            echo "| Composant | Référence |"
            echo "|---|---|"
            for composant in back front; do
              echo "| \`$composant\` | \`${prefixe}/orion-microcrm-${composant}:${tag}\` |"
            done
            echo ""
            echo "Scannées **avant** publication : aucune vulnérabilité HIGH/CRITICAL corrigible."
          } >> "$GITHUB_STEP_SUMMARY"

      # Sur Pull Request, l'image est construite et scannée mais NON publiée :
      # l'auteur obtient le verdict de sécurité avant la fusion, sans polluer
      # le registre d'images jetables.
      - name: Rappeler que rien n'a été publié (hors main)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Images construites et scannées, mais NON publiées : la publication est réservée à la branche main."

  # ===========================================================================
  # RELEASE — versionnement automatisé
  #
  # semantic-release déduit la version des messages de commit conventionnels :
  # fix -> patch, feat -> mineure, BREAKING CHANGE -> majeure. La version, le
  # changelog et le tag Git proviennent ainsi d'une source unique de vérité
  # (docs/03, §2.2), ce qui répond à la faiblesse f4 de l'audit : plus de
  # « 0.0.1-SNAPSHOT » figé, plus de tag posé à la main.
  #
  # Les images NE SONT PAS reconstruites : les tags sémantiques sont ajoutés
  # au manifeste déjà publié (`docker buildx imagetools create`). C'est
  # l'application stricte du principe « construire une fois, déployer
  # partout » (P3) — l'artefact testé et scanné est exactement celui qui est
  # promu, au bit près.
  # ===========================================================================

  release:
    name: "⑤ Release · version, changelog et tags sémantiques"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [package]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Historique complet : semantic-release analyse tous les commits
          # depuis le dernier tag pour déterminer la version.
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Déterminer la version et publier la release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes \
            semantic-release@24.2.3 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/git@10.0.1 \
            conventional-changelog-conventionalcommits@8.0.0
          # La version publiée est relue depuis le dernier tag Git : c'est la
          # seule source fiable, semantic-release ne l'exposant pas
          # directement en sortie.
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Version publiée : $version"
          else
            echo "Aucune nouvelle version : aucun commit n'en justifiait une."
          fi

      - name: S'authentifier auprès de GHCR
        if: steps.semantic.outputs.version != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promouvoir les images avec les tags sémantiques
        if: steps.semantic.outputs.version != ''
        run: |
          set -euo pipefail
          prefixe="${{ needs.package.outputs.prefixe }}"
          source_tag="${{ needs.package.outputs.tag-sha }}"
          version="${{ steps.semantic.outputs.version }}"
          majeure="${version%%.*}"
          mineure="${version%.*}"

          for composant in back front; do
            source="${prefixe}/orion-microcrm-${composant}:${source_tag}"
            # imagetools create copie le MANIFESTE : aucune reconstruction,
            # aucun nouveau contenu. L'image promue est, au bit près, celle
            # qui a été testée et scannée.
            docker buildx imagetools create \
              --tag "${prefixe}/orion-microcrm-${composant}:${version}" \
              --tag "${prefixe}/orion-microcrm-${composant}:${mineure}" \
              --tag "${prefixe}/orion-microcrm-${composant}:${majeure}" \
              --tag "${prefixe}/orion-microcrm-${composant}:latest" \
              "$source"
            echo "Promue : $composant -> ${version}, ${mineure}, ${majeure}, latest"
          done

          {
            echo "### 🏷️ Release ${version}"
            echo ""
            echo "Images promues depuis \`${source_tag}\` **sans reconstruction** :"
            echo ""
            echo "| Composant | Tags |"
            echo "|---|---|"
            for composant in back front; do
              echo "| \`$composant\` | \`${version}\` · \`${mineure}\` · \`${majeure}\` · \`latest\` |"
            done
            echo ""
            echo "> \`latest\` est publié par commodité mais **n'est jamais utilisé pour déployer** :"
            echo "> un déploiement référence toujours un tag immuable (docs/03, §2.3)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # NOTIFICATION — synthèse des résultats du pipeline
  # ===========================================================================

  notification:
    name: "Notification des résultats"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      [
        lint-front,
        lint-scripts,
        lint-manifestes,
        build-front,
        build-back,
        test-front,
        test-back,
        test-scripts,
        sonarqube,
        scan-securite,
        package,
      ]
    # `always()` : la notification doit précisément se produire quand le
    # pipeline échoue — c'est son cas d'usage principal.
    if: always()
    permissions:
      contents: read
      # Élévation limitée à ce seul job et à ce seul périmètre, afin
      # d'autoriser l'ouverture d'une issue de suivi en cas d'échec.
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Récupérer les rapports des jobs de test
        uses: actions/download-artifact@v7.0.0
        with:
          path: artefacts
          pattern: rapports-*
          merge-multiple: true
        continue-on-error: true

      - name: Déterminer le statut global
        id: statut
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "valeur=echec" >> "$GITHUB_OUTPUT"
          elif [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "valeur=instable" >> "$GITHUB_OUTPUT"
          else
            echo "valeur=succes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la synthèse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/notify.py \
            --statut "${{ steps.statut.outputs.valeur }}" \
            --rapports artefacts \
            --canal resume --canal console --canal issue \
            --titre "Pipeline CI — MicroCRM"
