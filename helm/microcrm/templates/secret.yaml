{{- if .Values.secrets.enabled }}
{{/*
Secret applicatif, créé PAR NAMESPACE.

Désactivé par défaut : HSQLDB en mémoire ne demande aucun credential. La
structure existe pour la migration PostgreSQL, où elle portera le mot de
passe de la base.

Règle appliquée sans exception : seules les CLÉS figurent dans values.yaml.
Les VALEURS proviennent de --set ou d'un gestionnaire de secrets, jamais du
dépôt (lacune S5 de l'audit, menace M3).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microcrm.fullname" . }}-secrets
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.secrets.keys }}
  {{ .name }}: {{ required (printf "La valeur du secret %s doit être fournie (--set)" .name) .value | quote }}
  {{- end }}
{{- end }}
