{{- if .Values.back.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microcrm.fullname" . }}-{{ .Values.back.name }}
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.back.name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.back.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: {{ .Values.back.name }}
{{- end }}
---
{{- if .Values.front.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microcrm.fullname" . }}-{{ .Values.front.name }}
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.front.name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.front.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # Port fixé explicitement. Sans cela, Kubernetes en attribue un au
      # hasard à chaque mise à jour : une campagne de charge en cours
      # perdrait sa cible en plein test, et l'on mesurerait une coupure
      # provoquée par l'outillage plutôt que par l'application.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: {{ .Values.front.name }}
{{- end }}
