# =============================================================================
# Filebeat en DaemonSet — collecte des journaux des pods MicroCRM
# =============================================================================
#
# BUT
#   Collecter les journaux des pods applicatifs et les expédier vers la stack
#   ELK qui tourne sur l'hôte. Répond à la lacune S7 de l'audit : Orion ne
#   dispose aujourd'hui d'aucun journal centralisé.
#
# POURQUOI UN DAEMONSET, ET NON LE FILEBEAT DE L'HÔTE
#   Les journaux des pods vivent DANS le nœud Minikube, pas sur l'hôte. Un
#   Filebeat exécuté sur la machine ne les voit pas. Le DaemonSet garantit
#   exactement une instance par nœud, avec accès à /var/log/containers — et
#   cette propriété reste vraie quand le cluster passe à plusieurs nœuds.
#
# ENRICHISSEMENT
#   Le processeur `add_kubernetes_metadata` associe chaque ligne au pod, au
#   namespace et au conteneur qui l'a émise. Sans lui, on obtiendrait un flux
#   de texte sans origine identifiable — inexploitable pour un tableau de bord
#   par composant.
#
# DÉPLOIEMENT
#   kubectl apply -f elk/k8s/filebeat-daemonset.yaml
#
# NOTE — accès à l'hôte depuis Minikube
#   `host.minikube.internal` est résolu par Minikube vers la machine hôte.
#   Sur un cluster managé, cette adresse est remplacée par le service ELK
#   interne au cluster ou par un point d'entrée managé.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: orion-observabilite
  labels:
    app.kubernetes.io/part-of: microcrm
    app.kubernetes.io/component: observabilite
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: orion-observabilite
---
# Droits STRICTEMENT limités à la lecture des métadonnées nécessaires à
# l'enrichissement. Filebeat ne modifie jamais l'état du cluster : aucun verbe
# d'écriture n'est accordé (principe du moindre privilège, lacune S5).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat-lecture
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat-lecture
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: orion-observabilite
roleRef:
  kind: ClusterRole
  name: filebeat-lecture
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: orion-observabilite
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: journaux-pods
        enabled: true
        paths:
          - /var/log/containers/*.log
        parsers:
          - container:
              stream: all
              # « auto » et non « cri » : Minikube avec le pilote Docker
              # journalise au format Docker, pas CRI. Coder le format en dur
              # rendait le collecteur dépendant du runtime du cluster, et
              # provoquait « parsing CRI timestamp » sur chaque ligne.
              format: auto
        prospector.scanner.symlinks: true
        fields:
          source_type: kubernetes
          service: microcrm
        fields_under_root: true

    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          in_cluster: true
          default_indexers.enabled: true
          default_matchers.enabled: true
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

      # Ne conserver que les journaux des namespaces d'Orion : sans ce filtre,
      # l'index serait noyé sous les journaux du plan de contrôle Kubernetes,
      # sans rapport avec l'application.
      - drop_event:
          when:
            not:
              or:
                - equals:
                    kubernetes.namespace: "orion-dev"
                - equals:
                    kubernetes.namespace: "orion-staging"

      - drop_fields:
          fields: ["agent.ephemeral_id", "ecs.version", "input.type", "log.offset"]
          ignore_missing: true

      # nginx journalise en JSON, Spring Boot en texte : on tente le décodage
      # sans faire échouer les lignes qui n'en sont pas.
      - decode_json_fields:
          fields: ["message"]
          target: "json"
          overwrite_keys: false
          add_error_key: false
          max_depth: 2

    output.elasticsearch:
      hosts: ["http://host.minikube.internal:9200"]
      index: "orion-k8s-%{+yyyy.MM.dd}"

    # Le modèle d'index est géré par scripts/elk-setup.sh, comme pour le
    # Filebeat de l'hôte : les mappings de champs y sont déclarés explicitement.
    setup.template.enabled: false
    setup.ilm.enabled: false
    setup.dashboards.enabled: false

    logging.level: info
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: orion-observabilite
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: microcrm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebeat
        app.kubernetes.io/part-of: microcrm
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      # Nécessaire pour lire /var/log/containers, dont les fichiers
      # appartiennent à root sur le nœud.
      securityContext:
        runAsUser: 0
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.3
          args: ["-c", "/etc/filebeat.yml", "-e", "--strict.perms=false"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 300Mi
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: journaux-conteneurs
              mountPath: /var/log/containers
              readOnly: true
            - name: journaux-pods
              mountPath: /var/log/pods
              readOnly: true
            # Les fichiers de /var/log/containers sont des liens symboliques
            # vers /var/lib/docker/containers : sans ce montage, Filebeat
            # suivrait des liens pointant dans le vide.
            - name: journaux-docker
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: donnees
              mountPath: /usr/share/filebeat/data
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        - name: journaux-conteneurs
          hostPath:
            path: /var/log/containers
        - name: journaux-pods
          hostPath:
            path: /var/log/pods
        - name: journaux-docker
          hostPath:
            path: /var/lib/docker/containers
        - name: donnees
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
