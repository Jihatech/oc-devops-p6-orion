# Configuration Ansible du projet Orion.
[defaults]
inventory            = inventaire.ini
roles_path           = roles
host_key_checking    = False
stdout_callback      = yaml
interpreter_python   = auto_silent
# Les playbooks orchestrent des outils locaux (docker, helm, kubectl) sur la
# machine de l'opérateur : aucun fait distant n'est nécessaire, et leur
# collecte coûterait plusieurs secondes par exécution.
gathering            = explicit

[privilege_escalation]
become = False
