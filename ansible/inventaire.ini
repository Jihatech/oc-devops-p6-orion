# Inventaire Ansible — Orion
#
# L'infrastructure cible est un cluster Minikube LOCAL : les playbooks
# s'exécutent sur la machine de l'opérateur et pilotent docker, helm et
# kubectl. La connexion est donc « local », sans SSH.
#
# Pour un cluster distant, il suffira d'ajouter un groupe avec les hôtes
# concernés : les tâches, elles, restent inchangées.

[local]
localhost ansible_connection=local

[local:vars]
projet_racine=..
namespace_dev=orion-dev
namespace_staging=orion-staging
